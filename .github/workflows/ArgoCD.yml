
name: Project K8s automation with ArgoCD

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_USER: prasadd5
      IMAGE_BASE: my-springboot-app  # Change to your app name
      VERSION_FILE: .version         # File to store version number between runs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and increment version
        id: versioning
        run: |
          if [ ! -f $VERSION_FILE ]; then
            echo "1" > $VERSION_FILE
          fi
          VERSION=$(cat $VERSION_FILE)
          NEW_VERSION=$((VERSION + 1))
          echo $NEW_VERSION > $VERSION_FILE
          echo "VERSION=v$NEW_VERSION" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag with IST date/time
        run: |
          IST_DATE=$(TZ=Asia/Kolkata date +'%Y%m%d-%H%M%S')
          echo "TAG=${DOCKER_USER}/${IMAGE_BASE}-${IST_DATE}:${VERSION}" >> $GITHUB_ENV

      - name: Build and push Docker image (excluding k8s dir)
        run: |
          echo "TAG = $TAG"
          docker build --exclude k8s -t $TAG .
          docker push $TAG

      - name: Update image tag in k8s manifest
        run: |
          sed -i "s|image: .*|image: ${TAG}|" k8s/deploy.yml

      - name: Commit and push manifest change
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add $VERSION_FILE k8s/deploy.yml
          git commit -m "Update image to ${TAG}"
          git push
